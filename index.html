    <script>
      // Applies the saved theme before first paint so the page never flashes
      // the wrong background. The store rehydrates from the same values.
      ;(function () {
        try {
          var stored = localStorage.getItem('gp-theme')
          var mode = stored ? JSON.parse(stored).state.mode : null
          if (!mode) {
            var legacy = localStorage.getItem('mode')
            mode =
              legacy === 'lite'
                ? 'light'
                : legacy === 'dark'
                  ? 'dark'
                  : window.matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'dark'
                    : 'light'
          }
          document.documentElement.classList.toggle('dark', mode === 'dark')
          document.documentElement.style.colorScheme = mode
        } catch (error) {
          /* Storage unavailable — fall back to the stylesheet default. */
        }
      })()
    </script>
